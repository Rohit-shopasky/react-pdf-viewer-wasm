name: Publish to npm (OIDC / Trusted Publishing)

on:
  push:
    branches:
      - main

# Trusted Publishing: GitHub mints an OIDC id-token that npm verifies.
# No NPM_TOKEN secret required — npm trusts this specific workflow.
permissions:
  contents: read
  id-token: write   # Required for npm Trusted Publishing + provenance

jobs:
  publish:
    name: Build & Publish Packages
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Node + npm registry ───────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # ══════════════════════════════════════════════════════════════════
      #  Package 1: react-pdf-viewer-wasm
      # ══════════════════════════════════════════════════════════════════

      - name: Install dependencies (react-pdf-viewer-wasm)
        run: npm ci

      - name: Build (react-pdf-viewer-wasm)
        run: npm run build

      - name: Publish react-pdf-viewer-wasm
        run: npm publish --provenance --access public

      # ══════════════════════════════════════════════════════════════════
      #  Package 2: pdf-viewer-assets
      # ══════════════════════════════════════════════════════════════════

      - name: Publish pdf-viewer-assets
        working-directory: pdf-viewer-assets
        run: npm publish --provenance --access public

